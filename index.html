<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحضير الصف الأول</title>

  <style>
    :root {
      --bg-color: #0F172A;
      --panel-bg: #1E293B;
      --text-color: #FFFFFF;
      --accent-color: #60A5FA;
      --input-bg: #334155;
      --btn-hover: #1D4ED8;
    }

    [data-theme="blue"] {
      --bg-color: #0B132B;
      --panel-bg: #1C2541;
      --text-color: #FFFFFF;
      --accent-color: #4CC9F0;
      --input-bg: #3A506B;
      --btn-hover: #4361EE;
    }

    [data-theme="dark"] {
      --bg-color: #0F172A;
      --panel-bg: #1E293B;
      --text-color: #FFFFFF;
      --accent-color: #FACC15;
      --input-bg: #334155;
      --btn-hover: #16A34A;
    }

    [data-theme="light"] {
      --bg-color: #F1F5F9;
      --panel-bg: #FFFFFF;
      --text-color: #0F172A;
      --accent-color: #2563EB;
      --input-bg: #E2E8F0;
      --btn-hover: #15803D;
    }

    [data-theme="green"] {
      --bg-color: #064E3B;
      --panel-bg: #022C22;
      --text-color: #FFFFFF;
      --accent-color: #34D399;
      --input-bg: #065F46;
      --btn-hover: #047857;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      direction: rtl;
      background: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
      margin: 0;
      transition: background 0.3s, color 0.3s;
    }

    h2 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
      font-weight: 800;
    }

    /* =========================
       شاشة القفل
    ========================= */

    #lockScreen {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .lock-box {
      background: var(--panel-bg);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 350px;
    }

    .lock-box input {
      background: var(--input-bg);
      color: var(--text-color);
      border: none;
      padding: 12px;
      font-size: 18px;
      border-radius: 8px;
      width: 80%;
      text-align: center;
      margin-bottom: 15px;
      outline: none;
      letter-spacing: 5px;
    }

    .lock-box button {
      background: #3B82F6;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    .error-msg {
      color: #EF4444;
      margin-top: 10px;
      display: none;
    }

    /* =========================
       المحتوى الرئيسي
    ========================= */

    #mainContent {
      display: none;
      max-width: 700px;
      margin: 0 auto;
    }

    .control-panel {
      background: var(--panel-bg);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: bold;
    }

    .control-group input,
    .control-group select {
      background: var(--input-bg);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      outline: none;
      width: 60%;
      text-align: center;
    }

    /* =========================
       أزرار إدارة الطلاب
    ========================= */

    .add-student-btn {
      background: #10B981;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
      transition: 0.2s;
    }

    .add-student-btn:hover {
      background: #059669;
    }

    /* =========================
       صفوف الطلاب
    ========================= */

    .student-row {
      background: var(--panel-bg);
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    @media(min-width: 500px) {
      .student-row {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .student-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .student-name {
      font-size: 15px;
      font-weight: bold;
    }

    .delete-btn {
      background: #EF4444;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .delete-btn:hover {
      background: #DC2626;
    }

       خيارات الحالة
    ========================= */

      gap: 6px;
      flex
